# ================= DNS =================
# Zona interna vinheria.local: responde os nomes dos servicos
domain-needed
bogus-priv
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
domain=vinheria.local
local=/vinheria.local/
expand-hosts
# Registros fixos (equivalente aos registros A da zona no DNS do Windows Server)
addn-hosts=/etc/vinheria.hosts
log-queries
log-facility=-
user=root

# ================= DHCP =================
# Escopo 172.28.0.100-150 (as maquinas que entram na rede recebem IP, gateway e DNS)
interface=eth0
dhcp-range=172.28.0.100,172.28.0.150,255.255.255.0,12h
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.2
dhcp-option=option:domain-name,vinheria.local
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
